<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión — CRM Café de la Esquina</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/crm.css">
</head>
<body>
<div class="login-page">
  <div class="login-card">

    <div class="login-logo">
      <div class="login-logo-icon"><i class="fas fa-mug-hot"></i></div>
      <h1>Café de la Esquina</h1>
      <p>Panel de gestión interno</p>
    </div>

    <!-- Accesos rápidos demo -->
    <p style="font-size:12px;color:var(--text-muted);margin-bottom:8px;font-weight:600;text-transform:uppercase;letter-spacing:.05em">Acceso rápido (demo)</p>
    <div class="demo-logins">
      <button class="demo-btn" data-email="admin@demo.com" data-pass="demo123">
        <div>
          <div class="demo-btn-role"><i class="fas fa-shield-alt me-2" style="color:var(--brand-primary)"></i>Administrador</div>
          <div class="demo-btn-email">admin@demo.com · demo123</div>
        </div>
        <i class="fas fa-arrow-right" style="color:var(--text-muted)"></i>
      </button>
      <button class="demo-btn" data-email="empleado@demo.com" data-pass="demo123">
        <div>
          <div class="demo-btn-role"><i class="fas fa-user me-2" style="color:#3B82F6"></i>Empleado</div>
          <div class="demo-btn-email">empleado@demo.com · demo123</div>
        </div>
        <i class="fas fa-arrow-right" style="color:var(--text-muted)"></i>
      </button>
    </div>

    <hr class="login-divider">

    <!-- Formulario -->
    <div id="login-error" class="alert alert-danger d-none mb-3" role="alert">
      <i class="fas fa-exclamation-circle me-2"></i>
      <span id="login-error-msg">Credenciales incorrectas.</span>
    </div>

    <form id="login-form" novalidate>
      <div class="form-group">
        <label class="form-label" for="input-email">Correo electrónico</label>
        <input type="email" id="input-email" name="email" class="form-control-crm" placeholder="tu@correo.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label" for="input-pass">Contraseña</label>
        <div class="password-wrapper">
          <input type="password" id="input-pass" name="password" class="form-control-crm" placeholder="••••••••" required autocomplete="current-password">
          <button type="button" id="toggle-pass" tabindex="-1" title="Mostrar u ocultar contraseña" aria-label="Mostrar u ocultar contraseña">
            <i class="fas fa-eye" id="pass-icon"></i>
          </button>
        </div>
      </div>
      <button type="submit" class="btn-crm btn-crm-primary w-100 justify-content-center mt-2" id="btn-submit">
        <i class="fas fa-sign-in-alt"></i> Entrar al panel
      </button>
    </form>

    <p style="text-align:center;margin-top:20px;font-size:13px;color:var(--text-muted)">
      <a href="../index.html" style="color:var(--text-muted);text-decoration:none">
        <i class="fas fa-arrow-left me-1"></i>Volver al sitio web
      </a>
    </p>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/api.js"></script>
<script>
  // Si ya hay sesión, ir al dashboard
  (async () => {
    const session = await DB.getSession();
    if (session?.user) window.location.href = 'dashboard.html';
  })();

  // Botones demo
  document.querySelectorAll('.demo-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.getElementById('input-email').value = btn.dataset.email;
      document.getElementById('input-pass').value  = btn.dataset.pass;
      document.getElementById('login-form').dispatchEvent(new Event('submit'));
    });
  });

  // Mostrar/ocultar contraseña
  document.getElementById('toggle-pass').addEventListener('click', () => {
    const inp  = document.getElementById('input-pass');
    const icon = document.getElementById('pass-icon');
    if (inp.type === 'password') { inp.type = 'text';     icon.className = 'fas fa-eye-slash'; }
    else                         { inp.type = 'password'; icon.className = 'fas fa-eye'; }
  });

  // Submit
  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email    = document.getElementById('input-email').value.trim();
    const password = document.getElementById('input-pass').value;
    const btn      = document.getElementById('btn-submit');
    const errEl    = document.getElementById('login-error');
    const errMsg   = document.getElementById('login-error-msg');

    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verificando…';
    errEl.classList.add('d-none');

    const { data, error } = await DB.login(email, password);

    if (error || !data) {
      errMsg.textContent = typeof error === 'string' ? error : 'Credenciales incorrectas.';
      errEl.classList.remove('d-none');
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Entrar al panel';
      return;
    }

    window.location.href = 'dashboard.html';
  });
</script>
</body>
</html>
