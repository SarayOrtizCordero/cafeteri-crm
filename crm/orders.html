<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedidos — CRM Café de la Esquina</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/crm.css">
</head>
<body>

<crm-shell page-title="Pedidos">
  <div slot="topbar-actions">
    <button type="button" class="btn-crm btn-crm-primary btn-crm-sm" id="btn-new">
      <i class="fas fa-plus"></i> Nuevo pedido
    </button>
  </div>
  <main class="crm-content">

    <div class="page-header">
      <div>
        <h1 class="page-title">Pedidos</h1>
        <p class="page-subtitle">Gestión de pedidos para llevar o encargos especiales</p>
      </div>
    </div>

    <!-- STATS -->
    <div class="stat-grid columns-4">
      <div class="stat-card">
        <div class="stat-icon primary"><i class="fas fa-box-open"></i></div>
        <div class="stat-body"><div class="stat-value" id="stat-total">—</div><div class="stat-label">Total pedidos</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon warning"><i class="fas fa-clock"></i></div>
        <div class="stat-body"><div class="stat-value" id="stat-pendiente">—</div><div class="stat-label">Pendientes</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon info"><i class="fas fa-fire"></i></div>
        <div class="stat-body"><div class="stat-value" id="stat-preparacion">—</div><div class="stat-label">En preparación</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon success"><i class="fas fa-check"></i></div>
        <div class="stat-body"><div class="stat-value" id="stat-entregados">—</div><div class="stat-label">Entregados hoy</div></div>
      </div>
    </div>

    <!-- TABLA -->
    <div class="crm-card">
      <div class="crm-card-header">
        <span class="crm-card-title"><i class="fas fa-box-open text-brand me-2"></i>Listado</span>
        <div class="filter-bar mb-0">
          <div class="search-input-wrapper">
            <i class="fas fa-search search-icon"></i>
            <input type="search" id="input-search" class="form-control-crm" placeholder="Buscar pedido o cliente…">
          </div>
          <select id="filter-status" class="form-control-crm filter-select" title="Filtrar por estado" aria-label="Filtrar por estado">
            <option value="">Todos los estados</option>
            <option value="pendiente">Pendiente</option>
            <option value="en_preparacion">En preparación</option>
            <option value="listo">Listo</option>
            <option value="entregado">Entregado</option>
            <option value="cancelado">Cancelado</option>
          </select>
          <button type="button" class="btn-crm btn-crm-secondary btn-crm-sm" id="btn-clear" title="Limpiar filtros" aria-label="Limpiar filtros">
            <i class="fas fa-times"></i>
          </button>
        </div>
      </div>
      <div class="table-wrapper">
        <table class="crm-table">
          <thead>
            <tr>
              <th>Fecha</th>
              <th>Cliente</th>
              <th>Pedido</th>
              <th>Precio</th>
              <th>Recogida</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tbody-orders"></tbody>
        </table>
      </div>
    </div>

  </main>
</crm-shell>

<!-- MODAL: CREAR / EDITAR -->
<div class="modal fade" id="modal-order" tabindex="-1" aria-labelledby="modal-order-label" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modal-order-label">Nuevo pedido</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <form id="form-order" novalidate>
        <div class="modal-body">
          <input type="hidden" id="f-id">
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label" for="f-customer">Cliente</label>
              <select id="f-customer" name="customer_id" class="form-control-crm">
                <option value="">— Sin cliente asociado —</option>
              </select>
            </div>
            <div class="col-12">
              <label class="form-label" for="f-title">Nombre del pedido <span class="text-danger">*</span></label>
              <input type="text" id="f-title" name="title" class="form-control-crm" placeholder="Ej: Torta de cumpleaños, Box desayuno…" required>
            </div>
            <div class="col-12">
              <label class="form-label" for="f-desc">Descripción</label>
              <textarea id="f-desc" name="description" class="form-control-crm" rows="2" placeholder="Detalles del pedido, cantidades, personalizaciones…"></textarea>
            </div>
            <div class="col-6">
              <label class="form-label" for="f-price">Precio</label>
              <input type="number" id="f-price" name="price" class="form-control-crm" min="0" step="0.01" placeholder="0">
            </div>
            <div class="col-6">
              <label class="form-label" for="f-status">Estado</label>
              <select id="f-status" name="status" class="form-control-crm">
                <option value="pendiente">Pendiente</option>
                <option value="en_preparacion">En preparación</option>
                <option value="listo">Listo</option>
                <option value="entregado">Entregado</option>
                <option value="cancelado">Cancelado</option>
              </select>
            </div>
            <div class="col-12">
              <label class="form-label" for="f-pickup">Fecha y hora de recogida</label>
              <input type="datetime-local" id="f-pickup" name="pickup_date" class="form-control-crm">
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-crm btn-crm-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn-crm btn-crm-primary" id="btn-save">
            <i class="fas fa-save me-1"></i>Guardar
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/utils.js"></script>
<script src="js/crm-shell.js"></script>
<script src="js/pages/orders.js"></script>
</body>
</html>
