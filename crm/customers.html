<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clientes — CRM Café de la Esquina</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/crm.css">
</head>
<body>

<crm-shell page-title="Clientes">
  <div slot="topbar-actions">
    <button type="button" class="btn-crm btn-crm-secondary btn-crm-sm" id="btn-export">
      <i class="fas fa-download"></i> Exportar
    </button>
    <button type="button" class="btn-crm btn-crm-primary btn-crm-sm" id="btn-new">
      <i class="fas fa-plus"></i> Nuevo cliente
    </button>
  </div>
  <main class="crm-content">

    <div class="page-header">
      <div>
        <h1 class="page-title">Clientes</h1>
        <p class="page-subtitle">Directorio de clientes del café</p>
      </div>
    </div>

    <!-- STATS -->
    <div class="stat-grid columns-4">
      <div class="stat-card">
        <div class="stat-icon primary"><i class="fas fa-users"></i></div>
        <div class="stat-body"><div class="stat-value" id="stat-total">—</div><div class="stat-label">Total clientes</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon success"><i class="fas fa-user-check"></i></div>
        <div class="stat-body"><div class="stat-value" id="stat-mes">—</div><div class="stat-label">Nuevos este mes</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon info"><i class="fas fa-envelope"></i></div>
        <div class="stat-body"><div class="stat-value" id="stat-email">—</div><div class="stat-label">Con email</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon warning"><i class="fas fa-phone"></i></div>
        <div class="stat-body"><div class="stat-value" id="stat-phone">—</div><div class="stat-label">Con teléfono</div></div>
      </div>
    </div>

    <!-- TABLA -->
    <div class="crm-card">
      <div class="crm-card-header">
        <span class="crm-card-title"><i class="fas fa-users text-brand me-2"></i>Listado</span>
        <div class="filter-bar mb-0">
          <div class="search-input-wrapper">
            <i class="fas fa-search search-icon"></i>
            <input type="search" id="input-search" class="form-control-crm" placeholder="Buscar por nombre, email o teléfono…">
          </div>
          <button type="button" class="btn-crm btn-crm-secondary btn-crm-sm" id="btn-clear" title="Limpiar búsqueda" aria-label="Limpiar búsqueda">
            <i class="fas fa-times"></i>
          </button>
        </div>
      </div>
      <div class="table-wrapper">
        <table class="crm-table">
          <thead>
            <tr>
              <th>Cliente</th>
              <th>Teléfono</th>
              <th>Email</th>
              <th>Alta</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tbody-customers"></tbody>
        </table>
      </div>
      <div class="crm-card-footer d-flex align-items-center justify-content-between">
        <span id="pagination-info" class="text-muted-sm">—</span>
        <div id="pagination-btns" class="d-flex gap-2"></div>
      </div>
    </div>

  </main>
</crm-shell>

<!-- MODAL: CREAR / EDITAR -->
<div class="modal fade" id="modal-customer" tabindex="-1" aria-labelledby="modal-customer-label" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modal-customer-label">Nuevo cliente</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <form id="form-customer" novalidate>
        <div class="modal-body">
          <input type="hidden" id="f-id">
          <div class="row g-3">
            <div class="col-6">
              <label class="form-label" for="f-name">Nombre <span class="text-danger">*</span></label>
              <input type="text" id="f-name" name="name" class="form-control-crm" required>
            </div>
            <div class="col-6">
              <label class="form-label" for="f-surname">Apellido</label>
              <input type="text" id="f-surname" name="surname" class="form-control-crm">
            </div>
            <div class="col-12">
              <label class="form-label" for="f-email">Email</label>
              <input type="email" id="f-email" name="email" class="form-control-crm">
            </div>
            <div class="col-6">
              <label class="form-label" for="f-phone">Teléfono</label>
              <input type="tel" id="f-phone" name="phone" class="form-control-crm">
            </div>
            <div class="col-6">
              <label class="form-label" for="f-birth">Fecha de nacimiento</label>
              <input type="date" id="f-birth" name="birth_date" class="form-control-crm">
            </div>
            <div class="col-12">
              <label class="form-label" for="f-notes">Notas internas</label>
              <textarea id="f-notes" name="notes" class="form-control-crm" rows="3" placeholder="Preferencias, información relevante…"></textarea>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-crm btn-crm-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn-crm btn-crm-primary" id="btn-save">
            <i class="fas fa-save me-1"></i>Guardar
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- MODAL: DETALLE -->
<div class="modal fade" id="modal-detail" tabindex="-1" aria-labelledby="modal-detail-label" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modal-detail-label">Detalle del cliente</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body" id="modal-detail-body">
        <div class="text-center py-4"><div class="spinner mx-auto"></div></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-crm btn-crm-secondary" data-bs-dismiss="modal">Cerrar</button>
        <button type="button" class="btn-crm btn-crm-primary" id="btn-detail-edit">
          <i class="fas fa-edit me-1"></i>Editar
        </button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/utils.js"></script>
<script src="js/crm-shell.js"></script>
<script src="js/pages/customers.js"></script>
</body>
</html>
