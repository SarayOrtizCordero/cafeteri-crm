<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — CRM Café de la Esquina</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/crm.css">
</head>
<body>

<crm-shell page-title="Dashboard">
  <div slot="topbar-actions">
    <a href="reservations.html?new=1" class="btn-crm btn-crm-primary btn-crm-sm">
      <i class="fas fa-plus"></i> Nueva reserva
    </a>
  </div>
  <main class="crm-content">

    <div class="page-header">
      <div>
        <h1 class="page-title">Dashboard</h1>
        <p class="page-subtitle" id="dash-date">Cargando…</p>
      </div>
    </div>

    <!-- KPI CARDS -->
    <div class="stat-grid columns-5" id="kpi-grid">
      <div class="stat-card">
        <div class="stat-icon primary"><i class="fas fa-calendar-day"></i></div>
        <div class="stat-body">
          <div class="stat-value" id="kpi-reservas">—</div>
          <div class="stat-label">Reservas hoy</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon warning"><i class="fas fa-box-open"></i></div>
        <div class="stat-body">
          <div class="stat-value" id="kpi-pedidos">—</div>
          <div class="stat-label">Pedidos activos</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon danger"><i class="fas fa-exclamation-triangle"></i></div>
        <div class="stat-body">
          <div class="stat-value" id="kpi-incidencias">—</div>
          <div class="stat-label">Incidencias abiertas</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon info"><i class="fas fa-comments"></i></div>
        <div class="stat-body">
          <div class="stat-value" id="kpi-mensajes">—</div>
          <div class="stat-label">Mensajes sin responder</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon success"><i class="fas fa-users"></i></div>
        <div class="stat-body">
          <div class="stat-value" id="kpi-clientes">—</div>
          <div class="stat-label">Total clientes</div>
        </div>
      </div>
    </div>

    <!-- TABLAS PRINCIPALES -->
    <div class="row g-4">

      <!-- Reservas de hoy -->
      <div class="col-lg-8">
        <div class="crm-card">
          <div class="crm-card-header">
            <span class="crm-card-title"><i class="fas fa-calendar-check text-brand me-2"></i>Reservas de hoy</span>
            <a href="reservations.html" class="btn-crm btn-crm-secondary btn-crm-sm">Ver todas</a>
          </div>
          <div class="table-wrapper">
            <table class="crm-table">
              <thead>
                <tr>
                  <th>Hora</th>
                  <th>Cliente</th>
                  <th>Personas</th>
                  <th>Estado</th>
                  <th>Notas</th>
                </tr>
              </thead>
              <tbody id="tbody-reservas">
                <tr><td colspan="5" class="text-center py-4"><div class="spinner mx-auto" style="width:24px;height:24px"></div></td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Pedidos activos + Acciones rápidas -->
      <div class="col-lg-4 d-flex flex-column gap-4">

        <div class="crm-card">
          <div class="crm-card-header">
            <span class="crm-card-title"><i class="fas fa-box-open text-brand me-2"></i>Pedidos activos</span>
            <a href="orders.html" class="btn-crm btn-crm-secondary btn-crm-sm">Ver todos</a>
          </div>
          <div id="list-pedidos" style="max-height:260px;overflow-y:auto">
            <div class="text-center py-4"><div class="spinner mx-auto" style="width:24px;height:24px"></div></div>
          </div>
        </div>

        <div class="crm-card">
          <div class="crm-card-header">
            <span class="crm-card-title"><i class="fas fa-bolt text-brand me-2"></i>Acciones rápidas</span>
          </div>
          <div class="crm-card-body d-flex flex-column gap-2">
            <a href="reservations.html?new=1" class="btn-crm btn-crm-secondary w-100 justify-content-start">
              <i class="fas fa-calendar-plus text-brand"></i> Nueva reserva
            </a>
            <a href="orders.html?new=1" class="btn-crm btn-crm-secondary w-100 justify-content-start">
              <i class="fas fa-box text-warning"></i> Nuevo pedido
            </a>
            <a href="customers.html?new=1" class="btn-crm btn-crm-secondary w-100 justify-content-start">
              <i class="fas fa-user-plus text-info"></i> Nuevo cliente
            </a>
            <a href="incidents.html?new=1" class="btn-crm btn-crm-secondary w-100 justify-content-start">
              <i class="fas fa-exclamation-circle text-danger"></i> Reportar incidencia
            </a>
          </div>
        </div>

      </div>
    </div><!-- /row -->

  </main>
</crm-shell>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/utils.js"></script>
<script src="js/crm-shell.js"></script>
<script src="js/pages/dashboard.js"></script>
</body>
</html>
