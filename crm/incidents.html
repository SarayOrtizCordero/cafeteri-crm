<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Incidencias — CRM Café de la Esquina</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/crm.css">
</head>
<body>

<crm-shell page-title="Incidencias">
  <div slot="topbar-actions">
    <button type="button" class="btn-crm btn-crm-primary btn-crm-sm" id="btn-new">
      <i class="fas fa-plus"></i> Reportar incidencia
    </button>
  </div>
  <main class="crm-content">

    <div class="page-header">
      <div>
        <h1 class="page-title">Incidencias</h1>
        <p class="page-subtitle">Registro y seguimiento de incidencias operativas</p>
      </div>
    </div>

    <!-- STATS -->
    <div class="stat-grid columns-4">
      <div class="stat-card">
        <div class="stat-icon danger"><i class="fas fa-door-open"></i></div>
        <div class="stat-body"><div class="stat-value" id="stat-abiertas">—</div><div class="stat-label">Abiertas</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon warning"><i class="fas fa-spinner"></i></div>
        <div class="stat-body"><div class="stat-value" id="stat-proceso">—</div><div class="stat-label">En proceso</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon success"><i class="fas fa-check-circle"></i></div>
        <div class="stat-body"><div class="stat-value" id="stat-resueltas">—</div><div class="stat-label">Resueltas</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon danger"><i class="fas fa-fire"></i></div>
        <div class="stat-body"><div class="stat-value" id="stat-alta">—</div><div class="stat-label">Prioridad alta</div></div>
      </div>
    </div>

    <!-- TABLA -->
    <div class="crm-card">
      <div class="crm-card-header">
        <span class="crm-card-title"><i class="fas fa-exclamation-triangle text-brand me-2"></i>Listado</span>
        <div class="filter-bar mb-0">
          <select id="filter-status" class="form-control-crm filter-select" title="Filtrar por estado" aria-label="Filtrar por estado">
            <option value="">Todos los estados</option>
            <option value="abierta">Abierta</option>
            <option value="en_proceso">En proceso</option>
            <option value="resuelta">Resuelta</option>
            <option value="cerrada">Cerrada</option>
          </select>
          <select id="filter-priority" class="form-control-crm filter-select" title="Filtrar por prioridad" aria-label="Filtrar por prioridad">
            <option value="">Todas las prioridades</option>
            <option value="alta">Alta</option>
            <option value="media">Media</option>
            <option value="baja">Baja</option>
          </select>
        </div>
      </div>
      <div class="table-wrapper">
        <table class="crm-table">
          <thead>
            <tr>
              <th>Fecha</th>
              <th>Cliente</th>
              <th>Título</th>
              <th>Prioridad</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tbody-incidents"></tbody>
        </table>
      </div>
    </div>

  </main>
</crm-shell>

<!-- MODAL: CREAR / EDITAR -->
<div class="modal fade" id="modal-inc" tabindex="-1" aria-labelledby="modal-inc-label" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modal-inc-label">Reportar incidencia</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <form id="form-inc" novalidate>
        <div class="modal-body">
          <input type="hidden" id="f-id">
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label" for="f-customer">Cliente</label>
              <select id="f-customer" name="customer_id" class="form-control-crm">
                <option value="">— Sin cliente asociado —</option>
              </select>
            </div>
            <div class="col-12">
              <label class="form-label" for="f-title">Título <span class="text-danger">*</span></label>
              <input type="text" id="f-title" name="title" class="form-control-crm" placeholder="Breve descripción del problema" required>
            </div>
            <div class="col-12">
              <label class="form-label" for="f-desc">Descripción detallada</label>
              <textarea id="f-desc" name="description" class="form-control-crm" rows="3" placeholder="Qué pasó, cómo, cuándo…"></textarea>
            </div>
            <div class="col-6">
              <label class="form-label">Prioridad</label>
              <div class="d-flex gap-3 mt-1">
                <label class="radio-label">
                  <input type="radio" name="priority" value="baja" id="p-baja" checked> <span class="badge-status badge-severity-baja">Baja</span>
                </label>
                <label class="radio-label">
                  <input type="radio" name="priority" value="media" id="p-media"> <span class="badge-status badge-severity-media">Media</span>
                </label>
                <label class="radio-label">
                  <input type="radio" name="priority" value="alta" id="p-alta"> <span class="badge-status badge-severity-alta">Alta</span>
                </label>
              </div>
            </div>
            <div class="col-6">
              <label class="form-label" for="f-status">Estado</label>
              <select id="f-status" name="status" class="form-control-crm">
                <option value="abierta">Abierta</option>
                <option value="en_proceso">En proceso</option>
                <option value="resuelta">Resuelta</option>
                <option value="cerrada">Cerrada</option>
              </select>
            </div>
            <div class="col-12">
              <label class="form-label" for="f-resolution">Resolución</label>
              <textarea id="f-resolution" name="resolution" class="form-control-crm" rows="2" placeholder="Cómo se resolvió o qué se hizo…"></textarea>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-crm btn-crm-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn-crm btn-crm-primary" id="btn-save">
            <i class="fas fa-save me-1"></i>Guardar
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/utils.js"></script>
<script src="js/crm-shell.js"></script>
<script src="js/pages/incidents.js"></script>
</body>
</html>
