<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mensajes — CRM Café de la Esquina</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/crm.css">
</head>
<body>
<div class="crm-wrapper">

  <!-- SIDEBAR -->
  <aside class="crm-sidebar" id="crm-sidebar">
    <a href="dashboard.html" class="sidebar-brand">
      <div class="sidebar-brand-icon"><i class="fas fa-mug-hot"></i></div>
      <div class="sidebar-brand-text">Café de la Esquina<small>Panel de gestión</small></div>
    </a>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="sidebar-link"><i class="sidebar-link-icon fas fa-tachometer-alt"></i><span class="sidebar-link-text">Dashboard</span></a>
      <a href="customers.html" class="sidebar-link"><i class="sidebar-link-icon fas fa-users"></i><span class="sidebar-link-text">Clientes</span></a>
      <a href="reservations.html" class="sidebar-link"><i class="sidebar-link-icon fas fa-calendar-check"></i><span class="sidebar-link-text">Reservas</span></a>
      <a href="orders.html" class="sidebar-link"><i class="sidebar-link-icon fas fa-box-open"></i><span class="sidebar-link-text">Pedidos</span></a>
      <a href="incidents.html" class="sidebar-link"><i class="sidebar-link-icon fas fa-exclamation-triangle"></i><span class="sidebar-link-text">Incidencias</span></a>
      <a href="messages.html" class="sidebar-link"><i class="sidebar-link-icon fas fa-comments"></i><span class="sidebar-link-text">Mensajes</span></a>
    </nav>
    <div class="sidebar-footer">
      <div class="d-flex align-items-center gap-2">
        <div class="sidebar-user sidebar-user-footer">
          <div class="sidebar-avatar" id="sidebar-avatar">CA</div>
          <div class="sidebar-user-info">
            <div class="sidebar-user-name" id="sidebar-user-name">Cargando…</div>
            <div class="sidebar-user-role" id="sidebar-user-role">—</div>
          </div>
        </div>
        <button type="button" class="sidebar-collapse-btn" id="sidebar-collapse-btn" title="Colapsar menú" aria-label="Colapsar menú">
          <i class="fas fa-chevron-left"></i>
        </button>
      </div>
    </div>
  </aside>
  <div id="sidebar-overlay" class="sidebar-overlay"></div>

  <!-- MAIN -->
  <div class="crm-main" id="crm-main">

    <header class="crm-topbar">
      <button type="button" class="topbar-menu-btn" id="topbar-menu-btn" aria-label="Abrir menú"><i class="fas fa-bars"></i></button>
      <div class="topbar-breadcrumb">
        <span class="topbar-breadcrumb-item">CRM</span>
        <span class="topbar-breadcrumb-sep">/</span>
        <span class="topbar-breadcrumb-current">Mensajes</span>
      </div>
      <div class="topbar-spacer"></div>
      <div class="topbar-actions">
        <button type="button" class="btn-crm btn-crm-primary btn-crm-sm" id="btn-new-conv" title="Nueva conversación">
          <i class="fas fa-plus"></i> Nueva conversación
        </button>
        <div class="topbar-user">
          <div class="topbar-avatar" id="topbar-avatar">CA</div>
          <span class="topbar-user-name" id="topbar-user-name">Usuario</span>
        </div>
        <button type="button" class="btn-crm btn-crm-secondary btn-crm-sm" id="btn-logout" title="Cerrar sesión" aria-label="Cerrar sesión">
          <i class="fas fa-sign-out-alt"></i>
        </button>
      </div>
    </header>

    <main class="crm-content">

      <div class="page-header">
        <div>
          <h1 class="page-title">Mensajes</h1>
          <p class="page-subtitle">Historial de conversaciones con clientes</p>
        </div>
      </div>

      <!-- LAYOUT MENSAJES -->
      <div class="messages-layout" id="messages-layout">

        <!-- PANEL IZQUIERDO: Lista de conversaciones -->
        <div class="conversation-list">
          <div class="conversation-list-header">
            <div class="conversation-list-search">
              <i class="fas fa-search search-icon"></i>
              <input type="search" id="conv-search" class="form-control-crm" placeholder="Buscar cliente…" aria-label="Buscar conversación">
            </div>
          </div>
          <div class="conversation-list-body" id="conv-list">
            <div class="text-center py-4"><div class="spinner mx-auto"></div></div>
          </div>
        </div>

        <!-- PANEL DERECHO: Conversación activa -->
        <div class="conversation-panel" id="conv-panel">
          <div class="conversation-empty" id="conv-empty">
            <i class="fas fa-comments"></i>
            <p>Seleccioná un cliente para ver la conversación</p>
          </div>

          <!-- Header de la conversación (oculto hasta seleccionar) -->
          <div class="conversation-panel-header d-none" id="conv-header">
            <div id="conv-header-avatar"></div>
            <div>
              <div class="conversation-panel-title" id="conv-header-name">—</div>
              <div class="conversation-panel-subtitle" id="conv-header-sub">—</div>
            </div>
            <div class="ms-auto">
              <a href="#" id="conv-header-link" class="btn-crm btn-crm-secondary btn-crm-sm">
                <i class="fas fa-user"></i> Ver cliente
              </a>
            </div>
          </div>

          <!-- Mensajes -->
          <div class="conversation-messages d-none" id="conv-messages"></div>

          <!-- Input área -->
          <div class="conversation-input-area d-none" id="conv-input-area">
            <div class="conversation-input-row">
              <textarea id="msg-input" class="form-control-crm" rows="1" placeholder="Escribí un mensaje…" aria-label="Mensaje"></textarea>
              <div class="conversation-send-buttons">
                <button type="button" class="btn-crm btn-crm-primary btn-crm-sm" id="btn-send-out" title="Enviar mensaje saliente" aria-label="Enviar mensaje saliente">
                  <i class="fas fa-paper-plane"></i> Saliente
                </button>
                <button type="button" class="btn-crm btn-crm-secondary btn-crm-sm" id="btn-send-in" title="Registrar mensaje entrante" aria-label="Registrar mensaje entrante">
                  <i class="fas fa-inbox"></i> Entrante
                </button>
              </div>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>
</div>

<!-- MODAL: NUEVA CONVERSACIÓN -->
<div class="modal fade" id="modal-new-conv" tabindex="-1" aria-labelledby="modal-new-conv-label" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modal-new-conv-label">Nueva conversación</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        <label class="form-label" for="new-conv-customer">Seleccionar cliente</label>
        <select id="new-conv-customer" class="form-control-crm" aria-label="Seleccionar cliente">
          <option value="">— Seleccioná un cliente —</option>
        </select>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-crm btn-crm-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn-crm btn-crm-primary" id="btn-start-conv">
          <i class="fas fa-comments me-1"></i>Abrir conversación
        </button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/utils.js"></script>
<script>
Auth.requireAuth();

let activeCustomerId   = null;
let activeCustomerData = null;
let conversations      = [];

// Cargar lista de conversaciones
async function loadConversations(filter = '') {
  const { data, error } = await DB.getConversations();
  if (error) { showToast('Error', 'No se pudieron cargar los mensajes.', 'error'); return; }
  conversations = data || [];

  const filtered = filter
    ? conversations.filter(c => {
        const name = `${c.customer?.name || ''} ${c.customer?.surname || ''}`.toLowerCase();
        return name.includes(filter.toLowerCase());
      })
    : conversations;

  const listEl = document.getElementById('conv-list');
  if (!filtered.length) {
    listEl.innerHTML = '<p class="text-muted-sm text-center py-4">Sin conversaciones.</p>';
    return;
  }

  listEl.innerHTML = filtered.map(c => {
    const fullName = `${c.customer?.name || ''} ${c.customer?.surname || ''}`.trim() || 'Desconocido';
    const preview  = c.last_message?.message?.substring(0, 40) + (c.last_message?.message?.length > 40 ? '…' : '') || '';
    const time     = c.last_message ? formatDate(c.last_message.created_at, { relative: true }) : '';
    const isActive = c.customer?.id === activeCustomerId ? 'active' : '';
    return `
      <div class="conversation-item ${isActive}" onclick="openConversation('${c.customer?.id}')">
        ${customerAvatar(fullName, 40)}
        <div class="conversation-item-info">
          <div class="conversation-item-name">${fullName}</div>
          <div class="conversation-item-preview">${c.last_message?.direction === 'incoming' ? '← ' : '→ '}${preview}</div>
        </div>
        <div class="conversation-item-meta">
          <span class="conversation-item-time">${time}</span>
          ${c.unread ? `<span class="conversation-unread">${c.unread}</span>` : ''}
        </div>
      </div>`;
  }).join('');
}

// Abrir conversación de un cliente
async function openConversation(customerId) {
  activeCustomerId = customerId;
  const conv = conversations.find(c => c.customer?.id === customerId);
  activeCustomerData = conv?.customer || null;

  // Marcar activo en lista
  document.querySelectorAll('.conversation-item').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.conversation-item').forEach(el => {
    if (el.getAttribute('onclick')?.includes(customerId)) el.classList.add('active');
  });

  // Mostrar panel
  document.getElementById('conv-empty').classList.add('d-none');
  document.getElementById('conv-header').classList.remove('d-none');
  document.getElementById('conv-messages').classList.remove('d-none');
  document.getElementById('conv-input-area').classList.remove('d-none');

  // Mobile: mostrar panel
  document.getElementById('messages-layout').classList.add('panel-open');

  // Header
  const fullName = `${activeCustomerData?.name || ''} ${activeCustomerData?.surname || ''}`.trim();
  document.getElementById('conv-header-avatar').innerHTML = customerAvatar(fullName, 40);
  document.getElementById('conv-header-name').textContent = fullName;
  document.getElementById('conv-header-sub').textContent  = activeCustomerData?.email || activeCustomerData?.phone || '';
  document.getElementById('conv-header-link').href = `customers.html`;

  // Cargar mensajes
  await renderMessages(customerId);
  document.getElementById('msg-input').focus();
}

async function renderMessages(customerId) {
  const messagesEl = document.getElementById('conv-messages');
  messagesEl.innerHTML = '<div class="text-center py-3"><div class="spinner mx-auto" style="width:24px;height:24px"></div></div>';

  const { data, error } = await DB.getMessages(customerId);
  if (error || !data) { messagesEl.innerHTML = '<p class="text-muted-sm text-center py-4">No se pudieron cargar los mensajes.</p>'; return; }

  if (!data.length) {
    messagesEl.innerHTML = '<p class="text-muted-sm text-center py-4">Aún no hay mensajes en esta conversación.</p>';
    return;
  }

  messagesEl.innerHTML = data.map(m => `
    <div class="message-row ${m.direction}">
      <div>
        <div class="message-bubble ${m.direction}">${escapeHtml(m.message)}</div>
        <div class="message-time ${m.direction}">${formatDate(m.created_at, { time: true })}</div>
      </div>
    </div>`).join('');

  // Scroll al final
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

async function sendMessage(direction) {
  const input = document.getElementById('msg-input');
  const text  = input.value.trim();
  if (!text || !activeCustomerId) return;

  const { error } = await DB.createMessage({ customer_id: activeCustomerId, message: text, direction });
  if (error) { showToast('Error', 'No se pudo enviar el mensaje.', 'error'); return; }

  input.value = '';
  await renderMessages(activeCustomerId);
  await loadConversations(document.getElementById('conv-search').value);
}

document.addEventListener('DOMContentLoaded', async () => {
  await loadConversations();

  // Buscar conversación
  document.getElementById('conv-search').addEventListener('input', debounce((e) => {
    loadConversations(e.target.value);
  }, 300));

  // Enviar mensajes
  document.getElementById('btn-send-out').addEventListener('click', () => sendMessage('outgoing'));
  document.getElementById('btn-send-in').addEventListener('click',  () => sendMessage('incoming'));

  // Enviar con Enter (Shift+Enter = nueva línea)
  document.getElementById('msg-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage('outgoing');
    }
  });

  // Nueva conversación
  document.getElementById('btn-new-conv').addEventListener('click', async () => {
    const sel = document.getElementById('new-conv-customer');
    const { data } = await DB.getCustomers();
    const opts = (data || []).map(c =>
      `<option value="${c.id}">${c.name} ${c.surname || ''}</option>`
    ).join('');
    sel.innerHTML = '<option value="">— Seleccioná un cliente —</option>' + opts;
    openModal('modal-new-conv');
  });

  document.getElementById('btn-start-conv').addEventListener('click', () => {
    const customerId = document.getElementById('new-conv-customer').value;
    if (!customerId) { showToast('Atención', 'Seleccioná un cliente.', 'warning'); return; }
    closeModal('modal-new-conv');

    // Agregar a conversations si no existe
    const exists = conversations.find(c => c.customer?.id === customerId);
    if (!exists) {
      const { data: customers } = { data: DEMO_CUSTOMERS };
      const customer = DEMO_CUSTOMERS.find(c => c.id === customerId);
      if (customer) conversations.unshift({ customer, last_message: null, unread: 0, count: 0 });
    }
    loadConversations().then(() => openConversation(customerId));
  });
});
</script>
</body>
</html>
