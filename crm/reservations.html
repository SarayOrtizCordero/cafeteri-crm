<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reservas — CRM Café de la Esquina</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/crm.css">
</head>
<body>

<crm-shell page-title="Reservas">
  <div slot="topbar-actions">
    <button type="button" class="btn-crm btn-crm-primary btn-crm-sm" id="btn-new">
      <i class="fas fa-plus"></i> Nueva reserva
    </button>
  </div>
  <main class="crm-content">

    <div class="page-header">
      <div>
        <h1 class="page-title">Reservas</h1>
        <p class="page-subtitle">Gestión de reservas del café</p>
      </div>
    </div>

    <!-- STATS -->
    <div class="stat-grid columns-4">
      <div class="stat-card">
        <div class="stat-icon primary"><i class="fas fa-calendar-day"></i></div>
        <div class="stat-body"><div class="stat-value" id="stat-hoy">—</div><div class="stat-label">Hoy</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon warning"><i class="fas fa-clock"></i></div>
        <div class="stat-body"><div class="stat-value" id="stat-pendiente">—</div><div class="stat-label">Pendientes</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon success"><i class="fas fa-check-circle"></i></div>
        <div class="stat-body"><div class="stat-value" id="stat-confirmada">—</div><div class="stat-label">Confirmadas</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon danger"><i class="fas fa-times-circle"></i></div>
        <div class="stat-body"><div class="stat-value" id="stat-cancelada">—</div><div class="stat-label">Canceladas</div></div>
      </div>
    </div>

    <!-- TABLA -->
    <div class="crm-card">
      <div class="crm-card-header">
        <span class="crm-card-title"><i class="fas fa-calendar-check text-brand me-2"></i>Listado</span>
        <div class="filter-bar mb-0">
          <div class="search-input-wrapper">
            <i class="fas fa-search search-icon"></i>
            <input type="search" id="input-search" class="form-control-crm" placeholder="Buscar cliente…">
          </div>
          <input type="date" id="filter-date" class="form-control-crm filter-date" title="Filtrar por fecha" aria-label="Filtrar por fecha">
          <select id="filter-status" class="form-control-crm filter-select" title="Filtrar por estado" aria-label="Filtrar por estado">
            <option value="">Todos los estados</option>
            <option value="pendiente">Pendiente</option>
            <option value="confirmada">Confirmada</option>
            <option value="finalizada">Finalizada</option>
            <option value="cancelada">Cancelada</option>
          </select>
          <button type="button" class="btn-crm btn-crm-secondary btn-crm-sm" id="btn-clear" title="Limpiar filtros" aria-label="Limpiar filtros">
            <i class="fas fa-times"></i>
          </button>
        </div>
      </div>
      <div class="table-wrapper">
        <table class="crm-table">
          <thead>
            <tr>
              <th>Fecha y hora</th>
              <th>Cliente</th>
              <th>Personas</th>
              <th>Estado</th>
              <th>Notas</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tbody-reservations"></tbody>
        </table>
      </div>
    </div>

  </main>
</crm-shell>

<!-- MODAL: CREAR / EDITAR -->
<div class="modal fade" id="modal-res" tabindex="-1" aria-labelledby="modal-res-label" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modal-res-label">Nueva reserva</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <form id="form-res" novalidate>
        <div class="modal-body">
          <input type="hidden" id="f-id">
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label" for="f-customer">Cliente <span class="text-danger">*</span></label>
              <select id="f-customer" name="customer_id" class="form-control-crm" required>
                <option value="">— Seleccionar cliente —</option>
              </select>
            </div>
            <div class="col-12">
              <label class="form-label" for="f-date">Fecha y hora <span class="text-danger">*</span></label>
              <input type="datetime-local" id="f-date" name="reservation_date" class="form-control-crm" required>
            </div>
            <div class="col-6">
              <label class="form-label" for="f-guests">Personas <span class="text-danger">*</span></label>
              <input type="number" id="f-guests" name="guests" class="form-control-crm" min="1" max="50" value="2" required>
            </div>
            <div class="col-6">
              <label class="form-label" for="f-status">Estado</label>
              <select id="f-status" name="status" class="form-control-crm">
                <option value="pendiente">Pendiente</option>
                <option value="confirmada">Confirmada</option>
                <option value="finalizada">Finalizada</option>
                <option value="cancelada">Cancelada</option>
              </select>
            </div>
            <div class="col-12">
              <label class="form-label" for="f-notes">Notas</label>
              <textarea id="f-notes" name="notes" class="form-control-crm" rows="2" placeholder="Peticiones especiales, indicaciones…"></textarea>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-crm btn-crm-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn-crm btn-crm-primary" id="btn-save">
            <i class="fas fa-save me-1"></i>Guardar
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/utils.js"></script>
<script src="js/crm-shell.js"></script>
<script src="js/pages/reservations.js"></script>
</body>
</html>
